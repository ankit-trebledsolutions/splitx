# Production stack for the Hostinger VPS (Ubuntu 24.04). MongoDB stays on
# Atlas. Secrets live in backend/.env and the domains in ./.env; neither is in git.
#
#   docker compose up -d --build
services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Cloudflare + Nginx sit in front; see backend/src/config/env.js.
      TRUST_PROXY: 2
      # The face service below, on the compose network. Remove this line to
      # switch Face Scan off without stopping the container.
      FACE_SERVICE_URL: http://face:8000
    volumes:
      - uploads:/app/uploads
    depends_on:
      # Started, not healthy: the API must come up even while the face service
      # is still loading its models (it answers "not available" meanwhile).
      face:
        condition: service_started
    restart: unless-stopped
    # server.js waits up to 3s for AI jobs to close before shutting down.
    stop_grace_period: 20s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # One copy only: sockets, the reminder sweep, AI jobs and the Face Scan
    # worker live in this process.

  # Face Scan: finds the faces in a photo and fingerprints each (face-service/).
  # Reached only by the API as http://face:8000; no port is published. The
  # first build downloads the models (190 MB) and takes a few minutes.
  face:
    build: ./face-service
    environment:
      # ONNX Runtime threads per model: keep at or under the CPU limit below.
      FACE_THREADS: 2
    # Capped so a burst of uploads slows the tagging down, never the API.
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build: ./admin
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
